<!doctype html>
<html lang="vi">
  <body style="margin:0;background:#f7fbf9;font-family:Arial,sans-serif;color:#203044">
    <main style="max-width:480px;margin:32px auto;padding:28px;background:#fff;border-radius:20px">
      <p style="margin:0 0 8px;color:#079669;font-weight:700">ViNeat</p>
      <h1 style="margin:0 0 12px;font-size:22px">Mã đăng nhập của bạn</h1>
      <p style="margin:0 0 20px;color:#667085;line-height:1.6">
        Nhập mã này vào ứng dụng ViNeat để đăng nhập. Mã chỉ sử dụng một lần và sẽ hết hạn.
      </p>
      <p style="margin:0;padding:16px;text-align:center;border-radius:12px;background:#e8fbf4;color:#079669;font-size:30px;font-weight:700;letter-spacing:8px">
        {{ .Token }}
      </p>
      <p style="margin:20px 0 0;color:#667085;font-size:13px;line-height:1.5">
        Nếu bạn không yêu cầu mã này, hãy bỏ qua email.
      </p>
    </main>
  </body>
</html>
